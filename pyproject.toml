[project]
name = "otexperimentalmeasurement"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "openturns>=1.27",
]

[dependency-groups]
dev = [
    "numpydoc>=1.10.0",
    "pytest>=9.0.3",
    "sphinx-gallery>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["otExperimentalMeasurement"]

